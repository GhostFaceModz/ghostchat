  <style><![CDATA[
  svg { overflow: visible; }
  .glow { transform-origin: 32px 32px; animation: glowPulse 5.2s ease-in-out infinite; }
  .bezel { transform-origin: 32px 32px; animation: bezelSpin 26s linear infinite; }
  .launcher { transform-origin: 32px 32px; animation: breathe 5.2s ease-in-out infinite; transition: transform 280ms cubic-bezier(.34,1.35,.5,1); }
  svg:hover .launcher { animation: none; transform: translateY(-2.4px) scale(1.05); }
  svg:hover .glow { animation: none; opacity: 0.9; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.018); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.88; }
  }
  @keyframes bezelSpin { to { transform: rotate(360deg); } }
  @keyframes shineSweep {
    0%, 58% { transform: translateX(-80px); }
    86%, 100% { transform: translateX(80px); }
  }
  .shine { animation: shineSweep 4.8s cubic-bezier(.45,0,.2,1) infinite; }
  .pill-glow { transform-origin: 88px 32px; animation: glowPulse 5.2s ease-in-out infinite; }
  .pill-launcher { transform-origin: 88px 32px; animation: breathe 5.2s ease-in-out infinite; transition: transform 280ms cubic-bezier(.34,1.35,.5,1); }
  svg:hover .pill-launcher { animation: none; transform: translateY(-2.2px) scale(1.035); }
  .pill-shine { animation: shineSweep 4.8s cubic-bezier(.45,0,.2,1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .glow, .bezel, .launcher, .shine, .pill-glow, .pill-launcher, .pill-shine { animation: none !important; }
  }
]]></style>
