# Render Blueprint for GhostChat — free plan, no paid add-ons.
# Secret values are NOT stored here (sync: false = Render asks for them on creation).
# Do not paste real keys into this file.
services:
  - type: web
    name: ghostchat
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Node 22+ is required: supabase-js needs the built-in global WebSocket.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        value: https://rswtambjckwmlagydsvf.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash
      - key: AI_PROVIDER
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: local
      - key: GROK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_BASE
        value: "https://ghostchat-nfoc.onrender.com"
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_PLAN_PRO_ID
        sync: false
      - key: WHOP_PLAN_BUSINESS_ID
        sync: false
      - key: WHOP_CHECKOUT_PRO_URL
        sync: false
      - key: WHOP_CHECKOUT_BUSINESS_URL
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
