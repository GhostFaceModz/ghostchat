# Render Blueprint for GhostChat — free plan, no paid add-ons.
# Secret values are NOT stored here (sync: false = Render asks for them on creation).
# Do not paste real keys into this file.
services:
  - type: web
    name: ghostchat
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: SUPABASE_URL
        value: https://rswtambjckwmlagydsvf.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.7
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: grok
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_PLAN_PRO_ID
        sync: false
      - key: WHOP_PLAN_BUSINESS_ID
        sync: false
      - key: WHOP_CHECKOUT_PRO_URL
        sync: false
      - key: WHOP_CHECKOUT_BUSINESS_URL
        sync: false
      - key: NOTION_API_KEY
        sync: false
