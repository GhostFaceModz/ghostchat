# Keeps the free Render instance warm: Render sleeps free web services after
# ~15 minutes without traffic, so ping the health check every 10 minutes.
# Note: GitHub may delay scheduled runs by a few minutes and pauses schedules
# on repos with no activity for 60 days (re-enable from the Actions tab).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          # Retries cover a cold start (the first request can take ~60s).
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://ghostchat.pro/healthz
      - name: Trigger due re-crawls (optional)
        # Only runs when the CRON_SECRET repo secret is set; the server also re-crawls on its own every hour.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --silent --show-error --max-time 30 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ghostchat.pro/api/cron/recrawl || true
