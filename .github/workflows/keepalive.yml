# Backup keep-warm ping. GitHub often delays scheduled workflows by hours, so
# the primary keep-warm is the Supabase pg_cron job `ghostchat_keepwarm`
# (every 5 minutes, no new account). This workflow is a second line of defence.
# GitHub pauses schedules on repos with no activity for 60 days (re-enable
# from the Actions tab).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          # Retries cover a cold start (the first request can take ~60s).
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://ghostchat.pro/healthz
      - name: Trigger due re-crawls and idle-chat close
        # Only runs when the CRON_SECRET repo secret is set; the server also
        # catches up on due work when it wakes.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        if: ${{ env.CRON_SECRET != '' }}
        run: |
          curl --silent --show-error --max-time 30 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ghostchat.pro/api/cron/recrawl || true
          curl --silent --show-error --max-time 30 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ghostchat.pro/api/cron/live-idle || true
          curl --silent --show-error --max-time 30 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ghostchat.pro/api/cron/auto-recharge || true
          curl --silent --show-error --max-time 30 -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://ghostchat.pro/api/cron/digest || true
